# gitleaks configuration: the default rules, plus a narrow allowlist of values that are deliberately
# fake. Allowlist exact values only — never whole files or directories — so a real key added to the
# same file is still caught.

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures and documentation examples (not secrets)"
regexTarget = "secret"
regexes = [
  # Made-up invitation token in the web test for pasted invitation links (apps/web/test/review-fixes.test.tsx)
  '''^gms_inv_AbC123-xyz_$''',
  # 32-byte AES test key: the bytes 0..31, base64url (webhook-secret encryption tests)
  '''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''',
  # Placeholder SAM.gov keys in importer unit tests
  '''^sam-key-abcdef0123456789$''',
  '''^test-key-0123456789abcdef$''',
  # Illustrative Moov paymentMethodID in the PayeeCredential example of the concept document
  '''^3afc7533-7095-43bb-b21a-5c4dc5568451$''',
  # Mock-mode authenticator setup key shown by the web app when VITE_USE_MOCKS=true (apps/web/src/mocks/auth.ts)
  '''^QHX7-R2MP-4TLC-W9KD$''',
  '''^QHX7R2MP4TLCW9KD$''',
  # Resend (Svix) webhook test secret: whsec_ + the bytes 0..31, base64 (apps/api/test/helpers.ts)
  '''^whsec_AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$''',
  # Composio auth config id for staging: an identifier, not a credential. It was committed once in
  # apps/api/wrangler.toml and then moved to a Worker secret; this entry covers that one commit.
  '''^ac_fDKkT7ucr-hy$''',
]

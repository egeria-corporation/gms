name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Sensitive-data gate
        run: pnpm gate:sensitive
      - name: Compile TypeSpec
        run: pnpm spec:compile
      - name: CommonGrants spec check (v0.5.0 base)
        run: pnpm spec:check
      - name: Unit tests (contract tests validate against the compiled spec)
        run: pnpm test

  integration:
    # Integration suites and pgTAP against a real Supabase stack (Postgres, Auth, Storage) started in the job.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,realtime,mailpit
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: Compile TypeSpec (contract tests validate against it)
        run: pnpm spec:compile
      - name: Integration suites (serial)
        run: |
          eval "$(supabase status -o env | sed -E 's/^API_URL=/SUPABASE_URL=/; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/; s/^JWT_SECRET=/SUPABASE_JWT_SECRET=/' | grep -E '^SUPABASE_(URL|SERVICE_ROLE_KEY|JWT_SECRET)=' | sed 's/^/export /')"
          pnpm test:int

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GMS_AUTH_MODE: test
      GMS_MODE: multi
      GMS_ROOT_DOMAIN: localhost:3000
      GMS_DB_TIER: embedded
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/gms
      MERCURY_ENV: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Start database (embedded Postgres) and migrate
        run: pnpm db:up
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Database tests (RLS matrix, invariants)
        run: pnpm test:db
      - name: Agent evals
        run: pnpm evals
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @gms/web exec playwright install --with-deps chromium
      - name: Seed demo data
        run: pnpm seed
      - name: End-to-end tests (Playwright + axe)
        run: pnpm e2e
      - name: Dependency audit (report only)
        run: pnpm audit --audit-level high || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
